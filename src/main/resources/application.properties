# =====================================================
# Application
# =====================================================

spring.application.name=self-healing-automation
spring.main.web-application-type=none
spring.main.banner-mode=off


# =====================================================
# Datasource (Oracle)
# =====================================================

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
spring.datasource.username=selfheal_user
spring.datasource.password=SelfHeal@123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# =====================================================
# HikariCP Connection Pool
# =====================================================

spring.datasource.hikari.pool-name=SelfHealingPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000


# =====================================================
# JPA / Hibernate
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =====================================================
# Transactions
# =====================================================

spring.transaction.default-timeout=30
spring.data.jpa.repositories.bootstrap-mode=default


# =====================================================
# Logging (SQL Disabled)
# =====================================================

logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.context=INFO
logging.level.org.springframework.orm.jpa=INFO
